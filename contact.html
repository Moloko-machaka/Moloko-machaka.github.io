<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Moloko Machaka</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header / Navbar -->
<header>
  <nav>
    <h2 class="logo">Moloko Machaka</h2>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<!-- Contact Section -->
<section class="page-section contact-section">
<br>
  <br>
  <h1>Contact Me</h1>
  <p>Have a question or want to work together? Send me a message!</p>

  <!-- Contact Form -->
  <form action="https://formspree.io/f/xaqazedr" method="POST" class="contact-form">

    <label for="name">Name</label>
    <input id="name" type="text" name="name" placeholder="Your Name" required>

    <label for="email">Email</label>
    <input id="email" type="email" name="email" placeholder="Your Email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Your Message" rows="6" required></textarea>

    <button type="submit" class="btn cv-btn">Send Message</button>

    <!-- Hidden success message (optional for JS later) -->
    <p class="success-message" style="display:none;">
      Message sent successfully!
    </p>

  </form>
</section>

<div id="popupMessage" class="popup">
  <div class="popup-content">
    <p>✅ Message sent successfully!</p>
  </div>
</div>

<div id="footer"></div>
<script>
  fetch("footer.html")
          .then(res => res.text())
          .then(data => {
            document.getElementById("footer").innerHTML = data;
          });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector(".contact-form");
    const popup = document.getElementById("popupMessage");

    form.addEventListener("submit", function () {

      // Show popup
      popup.classList.add("show");

      // Hide after 3 seconds
      setTimeout(() => {
        popup.classList.remove("show");
      }, 3000);

    });
  });
</script>

</body>
</html>
